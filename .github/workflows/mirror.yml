name: Sync Roomly Mirrors

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: pianoorbit
        run: |
          git clone --mirror https://github.com/roomlyy/roomlyy.github.io.git roomlyy.github.io.git
          cd roomlyy.github.io.git
          git push --mirror https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/pianoorbit/pianoorbit.github.io.git
